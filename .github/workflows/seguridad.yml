name: seguridad-planta
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    env:
      PLC_PASSWORD: ${{ secrets.PLC_PASSWORD }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prueba funcional
        run: python scripts/prueba_funcional.py
